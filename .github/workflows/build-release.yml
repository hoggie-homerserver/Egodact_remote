name: Build Egodact Remote

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-pc:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build executable
        shell: pwsh
        run: |
          npm run build:exe
          if (!(Test-Path "dist/EgodactRemote.exe")) { throw "EXE build failed" }

      - name: Package PC release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item dist/EgodactRemote.exe out/EgodactRemote.exe
          if (Test-Path public) { Copy-Item public out/public -Recurse }
          if (Test-Path companion) { Copy-Item companion out/companion -Recurse }
          Copy-Item start-remote.cmd out/start-remote.cmd -ErrorAction SilentlyContinue
          Copy-Item start-remote-anywhere.cmd out/start-remote-anywhere.cmd -ErrorAction SilentlyContinue
          Copy-Item README.md out/README.md -ErrorAction SilentlyContinue
          Set-Content -Path out/INSTALL-PC.txt -Value @(
            "Egodact Remote - PC",
            "",
            "1. Pak deze zip uit in een vaste map, bijvoorbeeld C:\EgodactRemote",
            "2. Dubbelklik EgodactRemote.exe (lokaal) of start-remote-anywhere.cmd (overal bereikbaar)",
            "3. Laad de map 'companion' als unpacked extension in chrome://extensions",
            "4. Plak de token uit de agent-console in de companion-instellingen en klik Opslaan",
            "5. Dubbelklik 'EgodactRemote.exe --install-startup' via een snelkoppeling of run:",
            "      EgodactRemote.exe --install-startup",
            "   om Egodact Remote automatisch te starten bij Windows-login",
            "",
            "Autostart verwijderen: EgodactRemote.exe --uninstall-startup"
          )
          Compress-Archive -Path out/* -DestinationPath EgodactRemote-PC-win-x64.zip -Force

      - name: Upload PC artifact
        uses: actions/upload-artifact@v4
        with:
          name: EgodactRemote-PC-win-x64
          path: EgodactRemote-PC-win-x64.zip

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android-app
        run: |
          gradle assembleDebug
          ls -R app/build/outputs/apk || true

      - name: Prepare APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk EgodactRemote-Android.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: EgodactRemote-Android
          path: EgodactRemote-Android.apk

  release:
    name: Publish release
    needs: [build-pc, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show artifacts
        run: find artifacts -type f -maxdepth 3

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && format('build-{0}', github.run_number) || github.ref_name }}
          name: Egodact Remote ${{ github.ref_name == 'main' && format('build {0}', github.run_number) || github.ref_name }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
          files: |
            artifacts/EgodactRemote-PC-win-x64/EgodactRemote-PC-win-x64.zip
            artifacts/EgodactRemote-Android/EgodactRemote-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
