<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#212121">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Egodact Remote</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="pair" class="screen" hidden>
  <div class="pair-card">
    <svg class="pair-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-3.2-6.9"/>
      <path d="M21 3v5h-5"/>
    </svg>
    <h1>Egodact Remote</h1>
    <p class="muted">Open de link met token uit de agent-console op je PC, of plak de token hieronder.</p>
    <label class="field-label" for="pairToken">Token</label>
    <input id="pairToken" class="field" type="text" autocomplete="off" spellcheck="false" placeholder="token">
    <button id="pairSave" class="btn primary block">Verbinden</button>
    <p id="pairError" class="error" hidden></p>
  </div>
</div>

<div id="app" class="screen" hidden>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-3.2-6.9"/>
        <path d="M21 3v5h-5"/>
      </svg>
      <span>Egodact Remote</span>
    </div>
    <div id="pcState" class="pill offline">
      <span class="dot" aria-hidden="true"></span>
      <span id="pcText">PC offline</span>
    </div>
  </header>

  <main>
    <button id="restart" class="hero">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/>
        <path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/>
        <path d="M3 21v-5h5"/>
      </svg>
      <span class="hero-text">
        <strong>Herstart Egodact</strong>
        <small>extensie opnieuw laden + pagina verversen</small>
      </span>
    </button>

    <div class="grid">
      <button class="tile" data-command="reload-extension" data-payload='{"match":"Egodact"}'>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-3.2-6.9"/><path d="M21 3v5h-5"/>
        </svg>
        <span>Extensie</span>
      </button>
      <button class="tile" data-command="reload-tab" data-payload='{"urlPattern":"app.egodact.com"}'>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="3" width="16" height="18" rx="2"/>
          <path d="M8 7h8"/><path d="M8 11h8"/><path d="M8 15h5"/>
        </svg>
        <span>Pagina</span>
      </button>
      <button class="tile" data-command="open-tab" data-payload='{"url":"https://app.egodact.com/"}'>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 4h6v6"/><path d="M20 4l-9 9"/>
          <path d="M19 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4"/>
        </svg>
        <span>Open Egodact</span>
      </button>
      <button class="tile" data-command="reload-extensions" data-payload='{}'>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/>
          <path d="M12 12l8-4.5"/><path d="M12 12v9"/><path d="M12 12L4 7.5"/>
        </svg>
        <span>Alle extensies</span>
      </button>
    </div>

    <section class="card">
      <h2>Extensies op je PC</h2>
      <p id="extEmpty" class="muted small">Nog geen gegevens van de companion.</p>
      <ul id="extList" class="ext-list"></ul>
    </section>

    <section class="card">
      <h2>Laatste acties</h2>
      <p id="logEmpty" class="muted small">Nog niets uitgevoerd.</p>
      <ul id="log" class="log"></ul>
    </section>

    <footer class="foot">
      <span id="agentInfo" class="muted small"></span>
      <button id="unpair" class="link">Loskoppelen</button>
    </footer>
  </main>

  <div id="toast" class="toast" hidden></div>
</div>

<script src="app.js"></script>
</body>
</html>
